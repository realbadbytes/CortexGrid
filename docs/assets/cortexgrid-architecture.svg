<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" role="img" aria-labelledby="title description">
  <title id="title">CortexGrid N TB distributed inference architecture</title>
  <desc id="description">A controller divides an arbitrary-size model into N ordered stages, places them across worldwide compute providers, reaches untrusted providers only over mutually authenticated TLS, and settles verified work as CTX rewards.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0b1730"/>
    </linearGradient>
    <linearGradient id="controller" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132f4c"/>
      <stop offset="1" stop-color="#17305f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000814" flood-opacity=".42"/>
    </filter>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58e5e7"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .label { fill: #dcecff; font-weight: 700; letter-spacing: .08em; }
      .muted { fill: #8ea7c6; }
      .tiny { font-size: 14px; }
      .small { font-size: 17px; }
      .node-title { fill: #e8f6ff; font-size: 16px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1440" height="810" rx="28" fill="url(#background)"/>
  <circle cx="1270" cy="-30" r="330" fill="#113a5c" opacity=".18"/>
  <circle cx="30" cy="840" r="310" fill="#39266e" opacity=".14"/>

  <g class="sans">
    <text x="72" y="72" class="label" font-size="17">CORTEXGRID ARCHITECTURE</text>
    <text x="72" y="112" fill="#f4f9ff" font-size="31" font-weight="750">Any-size model inference across worldwide compute</text>
    <text x="72" y="143" class="muted small">N stages across global workers · one controller trust root · verified CTX rewards</text>

    <g filter="url(#shadow)">
      <rect x="70" y="208" width="292" height="354" rx="22" fill="#0f2038" stroke="#405979" stroke-width="2"/>
      <text x="98" y="249" class="label small">N TB MODEL</text>
      <text x="98" y="278" class="muted small">N ordered weight stages</text>
      <g transform="translate(98 309)">
        <rect width="236" height="168" rx="12" fill="#0a1729" stroke="#29435e"/>
        <g stroke="#07111f" stroke-width="2">
          <rect x="12" y="14" width="24" height="140" rx="5" fill="#4fd1c5"/>
          <rect x="38" y="14" width="24" height="140" rx="5" fill="#54bfe8"/>
          <rect x="64" y="14" width="24" height="140" rx="5" fill="#6aa8f7"/>
          <rect x="90" y="14" width="24" height="140" rx="5" fill="#858cf0"/>
          <rect x="116" y="14" width="24" height="140" rx="5" fill="#a78bfa"/>
          <rect x="142" y="14" width="24" height="140" rx="5" fill="#c084fc"/>
          <rect x="168" y="14" width="24" height="140" rx="5" fill="#d879dd"/>
          <rect x="194" y="14" width="24" height="140" rx="5" fill="#e17faf"/>
        </g>
        <text x="24" y="91" fill="#07111f" font-size="13" font-weight="800" transform="rotate(-90 24 91)">STAGE 0</text>
        <text x="102" y="91" fill="#07111f" font-size="13" font-weight="800" transform="rotate(-90 102 91)">STAGE i</text>
        <text x="206" y="91" fill="#07111f" font-size="13" font-weight="800" transform="rotate(-90 206 91)">STAGE N</text>
      </g>
      <rect x="98" y="500" width="236" height="38" rx="9" fill="#122943"/>
      <text x="216" y="525" text-anchor="middle" fill="#bdd1e8" font-size="15">SHA-256 committed artifacts</text>
    </g>

    <path d="M362 384 H470" fill="none" stroke="#58e5e7" stroke-width="4" marker-end="url(#arrow-cyan)"/>
    <text x="416" y="368" text-anchor="middle" class="muted tiny">manifest</text>
    <g filter="url(#shadow)">
      <rect x="476" y="254" width="274" height="258" rx="25" fill="url(#controller)" stroke="#58e5e7" stroke-width="2.5"/>
      <path d="M613 291 l38 14 v31 c0 30-16 51-38 63-22-12-38-33-38-63v-31z" fill="#58e5e7" opacity=".16" stroke="#58e5e7" stroke-width="2"/>
      <rect x="597" y="325" width="32" height="28" rx="5" fill="#58e5e7"/>
      <path d="M603 326v-8a10 10 0 0 1 20 0v8" fill="none" stroke="#58e5e7" stroke-width="6"/>
      <circle cx="613" cy="338" r="4" fill="#0b2136"/>
      <text x="613" y="429" text-anchor="middle" class="label small">CONTROLLER</text>
      <text x="613" y="458" text-anchor="middle" fill="#bdd1e8" font-size="15">placement · routing · verification</text>
      <text x="613" y="482" text-anchor="middle" fill="#bdd1e8" font-size="15">sole RPC client certificate</text>
    </g>

    <rect x="838" y="186" width="530" height="414" rx="26" fill="#0b192c" stroke="#a78bfa" stroke-width="2" stroke-dasharray="9 8"/>
    <text x="866" y="222" class="label small">GLOBAL PROVIDERS</text>
    <text x="1340" y="222" text-anchor="end" fill="#a78bfa" font-size="14" font-weight="700">NO PEER CONTROL</text>

    <path d="M750 337 C800 337 794 278 856 278" fill="none" stroke="#58e5e7" stroke-width="4" marker-end="url(#arrow-cyan)"/>
    <path d="M750 382 H856" fill="none" stroke="#58e5e7" stroke-width="4" marker-end="url(#arrow-cyan)"/>
    <path d="M750 427 C800 427 794 486 856 486" fill="none" stroke="#58e5e7" stroke-width="4" marker-end="url(#arrow-cyan)"/>
    <g transform="translate(772 352)">
      <rect width="67" height="28" rx="14" fill="#123b4f" stroke="#58e5e7"/>
      <text x="34" y="19" text-anchor="middle" fill="#80f1ef" font-size="14" font-weight="800">mTLS</text>
    </g>

    <g transform="translate(860 246)">
      <g>
        <rect width="216" height="100" rx="15" fill="#102640" stroke="#4fd1c5" stroke-width="2"/>
        <rect x="14" y="14" width="37" height="37" rx="8" fill="#4fd1c5"/>
        <text x="32" y="39" text-anchor="middle" fill="#09202d" font-size="15" font-weight="850">000</text>
        <text x="64" y="34" class="node-title">Provider A</text>
        <text x="64" y="56" class="muted tiny">region A · RAM/GPU</text>
        <rect x="14" y="69" width="188" height="18" rx="6" fill="#091725"/>
        <text x="108" y="82" text-anchor="middle" fill="#7fb2c6" font-size="11">raw RPC · loopback only</text>
      </g>
      <g transform="translate(238)">
        <rect width="216" height="100" rx="15" fill="#102640" stroke="#6aa8f7" stroke-width="2"/>
        <rect x="14" y="14" width="37" height="37" rx="8" fill="#6aa8f7"/>
        <text x="32" y="39" text-anchor="middle" fill="#09202d" font-size="15" font-weight="850">001</text>
        <text x="64" y="34" class="node-title">Provider B</text>
        <text x="64" y="56" class="muted tiny">region B · RAM/GPU</text>
        <rect x="14" y="69" width="188" height="18" rx="6" fill="#091725"/>
        <text x="108" y="82" text-anchor="middle" fill="#7fb2c6" font-size="11">raw RPC · loopback only</text>
      </g>
      <path d="M216 50 H236" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrow-violet)"/>

      <g transform="translate(0 124)">
        <rect width="216" height="100" rx="15" fill="#102640" stroke="#a78bfa" stroke-width="2"/>
        <rect x="14" y="14" width="37" height="37" rx="8" fill="#a78bfa"/>
        <text x="32" y="39" text-anchor="middle" fill="#16142c" font-size="15" font-weight="850">•••</text>
        <text x="64" y="34" class="node-title">Providers C…</text>
        <text x="64" y="56" class="muted tiny">global stage route</text>
        <rect x="14" y="69" width="188" height="18" rx="6" fill="#091725"/>
        <text x="108" y="82" text-anchor="middle" fill="#7fb2c6" font-size="11">controller-authorized work</text>
      </g>
      <g transform="translate(238 124)">
        <rect width="216" height="100" rx="15" fill="#102640" stroke="#e17faf" stroke-width="2"/>
        <rect x="14" y="14" width="37" height="37" rx="8" fill="#e17faf"/>
        <text x="32" y="39" text-anchor="middle" fill="#301325" font-size="15" font-weight="850">N</text>
        <text x="64" y="34" class="node-title">Provider N</text>
        <text x="64" y="56" class="muted tiny">final model stage</text>
        <rect x="14" y="69" width="188" height="18" rx="6" fill="#091725"/>
        <text x="108" y="82" text-anchor="middle" fill="#7fb2c6" font-size="11">signed work receipt</text>
      </g>
      <path d="M216 174 H236" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrow-violet)"/>

      <g transform="translate(0 248)" opacity=".65">
        <rect width="454" height="70" rx="14" fill="#14233a" stroke="#637592" stroke-width="1.5"/>
        <g fill="#263b58">
          <rect x="16" y="15" width="62" height="40" rx="7"/>
          <rect x="88" y="15" width="62" height="40" rx="7"/>
          <rect x="160" y="15" width="62" height="40" rx="7"/>
          <rect x="232" y="15" width="62" height="40" rx="7"/>
        </g>
        <text x="374" y="33" text-anchor="middle" fill="#bfd0e5" font-size="14" font-weight="700">R× TARGET</text>
        <text x="374" y="51" text-anchor="middle" fill="#8ea7c6" font-size="12">configurable replicas</text>
      </g>
    </g>

    <path d="M1104 600 V650 H696" fill="none" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrow-violet)"/>
    <text x="930" y="638" text-anchor="middle" class="muted tiny">signed receipts</text>
    <path d="M613 512 V650" fill="none" stroke="#58e5e7" stroke-width="3" marker-end="url(#arrow-cyan)"/>

    <g filter="url(#shadow)">
      <rect x="264" y="650" width="912" height="104" rx="22" fill="#0e2035" stroke="#385271" stroke-width="2"/>
      <text x="299" y="686" class="label small">VERIFIED SETTLEMENT</text>
      <text x="299" y="720" fill="#bdd1e8" font-size="16">receipt checks</text>
      <path d="M430 704 H478" stroke="#58e5e7" stroke-width="3" marker-end="url(#arrow-cyan)"/>
      <text x="503" y="720" fill="#bdd1e8" font-size="16">proof block</text>
      <g transform="translate(635 681)">
        <rect width="54" height="42" rx="8" fill="#152d49" stroke="#58e5e7"/>
        <rect x="66" width="54" height="42" rx="8" fill="#152d49" stroke="#58e5e7"/>
        <rect x="132" width="54" height="42" rx="8" fill="#152d49" stroke="#58e5e7"/>
        <path d="M54 21 H66 M120 21 H132" stroke="#58e5e7" stroke-width="3"/>
      </g>
      <path d="M842 704 H890" stroke="#58e5e7" stroke-width="3" marker-end="url(#arrow-cyan)"/>
      <text x="920" y="710" fill="#f4f9ff" font-size="18" font-weight="800">CTX REWARDS</text>
      <text x="920" y="731" class="muted tiny">paid only for finalized work</text>
    </g>
  </g>
</svg>
